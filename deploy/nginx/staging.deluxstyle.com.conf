# ============================================================================
# STAGING — nginx del HOST · CONFIG FINAL (HTTP + HTTPS)
# staging.deluxstyle.com  ->  contenedor "web" staging en 127.0.0.1:8080
# Requiere el snippet compartido conf.d/websocket-upgrade.conf ($connection_upgrade).
#
# Copia a:  /etc/nginx/sites-available/staging.deluxstyle.com.conf
# ============================================================================

# ---- HTTP :80 -> ACME + redirección a HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name staging.deluxstyle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://staging.deluxstyle.com$request_uri;
    }
}

# ---- HTTPS -> app staging (contenedor :8080) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.deluxstyle.com;

    ssl_certificate     /etc/letsencrypt/live/staging.deluxstyle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.deluxstyle.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
