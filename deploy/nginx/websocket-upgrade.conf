# ============================================================================
# Delux — snippet COMPARTIDO para WebSockets (va en /etc/nginx/conf.d/)
# Define una sola vez el mapa de "upgrade". Ambos sitios (staging y prod) lo
# usan; por eso NO se define dentro de cada server block (evita "duplicate map").
#
# Copia a: /etc/nginx/conf.d/websocket-upgrade.conf
# ============================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
