# ============================================================================
# JENKINS (CI) — nginx del HOST · BOOTSTRAP (solo HTTP :80) para emitir el cert
# Jenkins corre en 127.0.0.1:8082 (8080=staging, 8081=prod).
#
# Copia a:  /etc/nginx/sites-available/ci.deluxstyle.com.conf
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ci.deluxstyle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
