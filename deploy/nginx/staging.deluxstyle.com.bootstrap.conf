# ============================================================================
# STAGING — nginx del HOST · BOOTSTRAP (solo HTTP :80) para emitir el certificado
# App staging: contenedor "web" en 127.0.0.1:8080 (APP_ENV=staging).
#
# Copia a:  /etc/nginx/sites-available/staging.deluxstyle.com.conf
# Enlaza:   /etc/nginx/sites-enabled/staging.deluxstyle.com.conf
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name staging.deluxstyle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
