# ============================================================================
# PRODUCCIÓN — nginx del HOST · CONFIG FINAL (HTTP + HTTPS)
# deluxstyle.com + www  ->  contenedor "web" prod en 127.0.0.1:8081
# www.deluxstyle.com redirige (301) al apex. Requiere el snippet compartido
# conf.d/websocket-upgrade.conf ($connection_upgrade).
#
# Copia a:  /etc/nginx/sites-available/deluxstyle.com.conf
# ============================================================================

# ---- HTTP :80 -> ACME + redirección a HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name deluxstyle.com www.deluxstyle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://deluxstyle.com$request_uri;
    }
}

# ---- HTTPS www -> redirige al dominio canónico (apex) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.deluxstyle.com;

    ssl_certificate     /etc/letsencrypt/live/deluxstyle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deluxstyle.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://deluxstyle.com$request_uri;
}

# ---- HTTPS apex -> app prod (contenedor :8081) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deluxstyle.com;

    ssl_certificate     /etc/letsencrypt/live/deluxstyle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deluxstyle.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
