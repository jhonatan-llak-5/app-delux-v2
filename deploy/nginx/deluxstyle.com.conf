# ============================================================================
# Delux — nginx del HOST (VPS) · CONFIG FINAL (HTTP + HTTPS)
# ----------------------------------------------------------------------------
# Termina el TLS en el host y reenvía TODO al contenedor "web" (nginx interno)
# que escucha en 127.0.0.1:8080. El contenedor ya enruta /api, /ws, /static,
# /media y el SPA; aquí solo hacemos el proxy + HTTPS.
#
# Canónico: https://deluxstyle.com   (www.deluxstyle.com -> 301 -> apex)
#
# Requiere que exista el certificado:
#   /etc/letsencrypt/live/deluxstyle.com/fullchain.pem
# (se genera con certbot; ver DOMAIN_SETUP.md)
#
# Copia a:  /etc/nginx/sites-available/deluxstyle.com.conf   (reemplaza el bootstrap)
# ============================================================================

# Mapa para el "upgrade" de WebSockets (contexto http{}).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP :80 -> ACME + redirección a HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name deluxstyle.com www.deluxstyle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://deluxstyle.com$request_uri;
    }
}

# ---- HTTPS www -> redirige al dominio canónico (apex) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.deluxstyle.com;

    ssl_certificate     /etc/letsencrypt/live/deluxstyle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deluxstyle.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://deluxstyle.com$request_uri;
}

# ---- HTTPS apex -> aplicación (contenedor web :8080) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deluxstyle.com;

    ssl_certificate     /etc/letsencrypt/live/deluxstyle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deluxstyle.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Subidas grandes (imágenes/archivos). Igual que el nginx del contenedor.
    client_max_body_size 100m;

    # Renovaciones de certificado
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Clave para que Django/DRF sepan que la conexión original es HTTPS.
        proxy_set_header X-Forwarded-Proto https;

        # Soporte WebSocket (notificaciones / tracking)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 3600s;
    }
}
