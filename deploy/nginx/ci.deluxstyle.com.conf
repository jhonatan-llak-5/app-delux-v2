# ============================================================================
# JENKINS (CI) — nginx del HOST · CONFIG FINAL (HTTP + HTTPS)
# ci.deluxstyle.com  ->  Jenkins en 127.0.0.1:8082
# Requiere el snippet compartido conf.d/websocket-upgrade.conf.
#
# Copia a:  /etc/nginx/sites-available/ci.deluxstyle.com.conf
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ci.deluxstyle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://ci.deluxstyle.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ci.deluxstyle.com;

    ssl_certificate     /etc/letsencrypt/live/ci.deluxstyle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ci.deluxstyle.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Jenkins usa WebSocket para la consola en vivo (agente <-> UI)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
