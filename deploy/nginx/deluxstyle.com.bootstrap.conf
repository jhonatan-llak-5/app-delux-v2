# ============================================================================
# Delux — nginx del HOST (VPS) · CONFIG BOOTSTRAP (solo HTTP :80)
# ----------------------------------------------------------------------------
# Uso TEMPORAL: se instala PRIMERO, solo para que Let's Encrypt pueda validar
# el dominio (ACME) y emitir el certificado. Una vez emitido, se reemplaza por
# deluxstyle.com.conf (que ya incluye HTTPS).
#
# Copia a:  /etc/nginx/sites-available/deluxstyle.com.conf
# Enlaza a: /etc/nginx/sites-enabled/deluxstyle.com.conf
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name deluxstyle.com www.deluxstyle.com;

    # --- Validación de Let's Encrypt (certbot webroot) ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Mientras se emite el certificado, sirve la app por HTTP (temporal) ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
